  desc_bup_disclaim:
    description: >-
      Buprenorphine Disclaimer: There is a range of buprenorphine products that include
      formulations with FDA approval for pain and formulations that have FDA approval
      for opioid use disorder, which are prescribed off label for pain management.
      The CDC currently recommends that buprenorphine should not be counted in total
      MME or MME/Day calculations because buprenorphine has partial agonist properties
      at opioid receptors that confer a ceiling effect on respiratory depression (Dowell
      et al., 2022). There are several national prescribing guidelines, however, that
      endorse the use of buprenorphine as an analgesic for chronic pain management.
      For participants who have been prescribed buprenorphine for pain management
      ( and not OUD ), this tool will create daily MME values based on the four definitions
      with and without buprenorphine daily MMEs. The MME values, inclusive and exclusive
      of buprenorphine products, will only be used for research purposes. Please note
      buprenorphine to morphine conversions are approximate (not defined by direct
      clinical studies of analgesic equivalence).
    type: string

