  desc01:
    description: >-
      The NIH HEAL CDE program requires clinical pain studies to collect data on prescribed/dispensed
      opioid use for pain management in trials involving human subjects. Prescribed/dispensed
      opioid use will be reported as daily morphine milligram equivalents (MMEs),
      which is a metric to estimate analgesic profile and/or overdose potential of
      the prescribed opioid medications.
    type: string

  mme_opioid_screen:
